<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Textless cover for «Attorney SEO» (also the OG image). A search bar on the left
     leads to a map with three pins (one highlighted, with five stars) and to a stack
     of result cards; one card — a practice-area page with an attorney portrait —
     is marked green as the one that gets the call. Palette as the series covers. */
  :root{ --bg:#0a0a0b; --warm:#d95926; --cool:#3987e5; --green:#199e70; --gold:#c98500; }
  *{box-sizing:border-box}
  body{margin:0;background:#000}
  .cover{position:relative;width:1672px;height:941px;overflow:hidden;
    background:
      radial-gradient(900px 560px at 12% -8%, rgba(57,135,229,.18), transparent 62%),
      radial-gradient(900px 560px at 92% 112%, rgba(25,158,112,.15), transparent 60%),
      var(--bg);}
  .grain{position:absolute;inset:0;opacity:.4}
  .grain i{position:absolute;border-radius:50%;background:#fff}
  svg{position:absolute;inset:0}
  .search{position:absolute;left:130px;top:420px;width:400px;height:84px;border-radius:42px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:20px;padding:0 32px;box-shadow:0 40px 100px rgba(0,0,0,.55)}
  .search .g{width:30px;height:30px;border-radius:50%;border:4px solid rgba(207,225,251,.85);position:relative;flex:none}
  .search .g::after{content:"";position:absolute;right:-11px;bottom:-9px;width:12px;height:4px;background:rgba(207,225,251,.85);transform:rotate(45deg)}
  .search span{height:14px;border-radius:7px;background:rgba(207,225,251,.45)}
  .map{position:absolute;left:720px;top:120px;width:420px;height:300px;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
    background:
      linear-gradient(0deg, transparent 47%, rgba(255,255,255,.08) 47% 53%, transparent 53%),
      linear-gradient(90deg, transparent 30%, rgba(255,255,255,.07) 30% 34%, transparent 34%),
      linear-gradient(120deg, transparent 62%, rgba(255,255,255,.06) 62% 65%, transparent 65%),
      repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 10px,rgba(255,255,255,.015) 10px 20px);}
  .pin{position:absolute;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:rgba(255,255,255,.28)}
  .pin::after{content:"";position:absolute;left:12px;top:12px;width:16px;height:16px;border-radius:50%;background:#0a0a0b}
  .pin.hot{background:var(--warm);width:56px;height:56px;box-shadow:0 20px 50px rgba(217,89,38,.45)}
  .pin.hot::after{left:17px;top:17px;width:22px;height:22px}
  .stars{position:absolute;left:720px;top:440px;display:flex;gap:12px}
  .stars b{width:36px;height:36px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .card{position:absolute;left:1220px;width:320px;height:120px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);padding:22px 24px;display:flex;gap:18px}
  .card .l{height:10px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 0 12px}
  .card .face{width:64px;height:64px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 38%, rgba(255,255,255,.55) 0 18%, transparent 19%), radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.45) 0 46%, transparent 47%), rgba(255,255,255,.08)}
  .card.cited{background:rgba(25,158,112,.12);border:2px solid rgba(25,158,112,.8);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .card.dim{opacity:.45}
  .card .ph{position:absolute;right:-24px;top:-24px;width:52px;height:52px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
  .card .ph b{width:22px;height:22px;border:4px solid #fff;border-radius:6px 6px 14px 6px;transform:rotate(-20deg);border-left-color:transparent;border-top-color:transparent}
</style>
</head>
<body>
<div id="root"></div>
<script>
function grain(n) {
  let s = 20261027, out = "";
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < n; i++) {
    const x = (rnd() * 1672).toFixed(0), y = (rnd() * 941).toFixed(0);
    const d = (rnd() * 1.6 + 0.6).toFixed(2), o = (rnd() * 0.3 + 0.05).toFixed(2);
    out += `<i style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;opacity:${o}"></i>`;
  }
  return out;
}
const cards = [[150, "dim"], [330, "cited"], [510, "dim"], [690, "dim"]];
const curve = (x1, y1, x2, y2, c, w) => `<path d="M${x1} ${y1} C ${(x1 + x2) / 2} ${y1}, ${(x1 + x2) / 2} ${y2}, ${x2} ${y2}" stroke="${c}" stroke-width="${w}" fill="none"/>`;
let paths = curve(530, 462, 720, 270, "rgba(57,135,229,.5)", 3) + curve(530, 462, 720, 470, "rgba(201,133,0,.45)", 2.5);
for (const [y, c] of cards) paths += curve(1140, 270, 1220, y + 60, c === "cited" ? "rgba(25,158,112,.75)" : "rgba(255,255,255,.14)", c === "cited" ? 3 : 1.5);
document.getElementById("root").insertAdjacentHTML("beforeend", `
  <div class="cover" id="cover">
    <div class="grain">${grain(240)}</div>
    <svg width="1672" height="941">${paths}</svg>
    <div class="search"><div class="g"></div><span style="width:170px"></span><span style="width:90px;background:rgba(255,179,141,.8)"></span></div>
    <div class="map">
      <div class="pin" style="left:70px;top:70px"></div>
      <div class="pin hot" style="left:190px;top:115px"></div>
      <div class="pin" style="left:320px;top:190px"></div>
    </div>
    <div class="stars"><b></b><b></b><b></b><b></b><b></b></div>
    ${cards.map(([y, c]) => `<div class="card ${c}" style="top:${y}px"><div class="face"></div><div style="flex:1"><div class="l" style="width:80%"></div><div class="l" style="width:95%"></div><div class="l" style="width:60%"></div></div>${c === "cited" ? '<div class="ph"><svg width="26" height="26" viewBox="0 0 24 24" style="position:static"><path fill="#fff" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></div>' : ""}</div>`).join("")}
  </div>`);
</script>
</body>
</html>
