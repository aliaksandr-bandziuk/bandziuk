<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Figures for the «Attorney SEO» article (27.10.2026). Same surface, type and slots
     as the GEO/AEO/LLM/ChatGPT SEO series. Every number is repeated in the article text. */
  :root{
    --surface:#111114; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"DejaVu Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:var(--sans)}
  .fig{width:1200px;background:var(--surface);padding:44px 48px 40px;margin:0 0 30px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h2{font-size:26px;line-height:1.25;font-weight:600;color:var(--ink);margin:0 0 6px}
  .sub{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0 0 26px;max-width:86ch}
  .note{font-size:13px;color:var(--muted);margin:22px 0 0;line-height:1.5}

  /* journey */
  .steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
  .step{border-radius:14px;padding:18px 16px 16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;position:relative}
  .step .n{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em;margin:0 0 10px}
  .step h3{font-size:16.5px;line-height:1.3;color:#fff;margin:0 0 10px;font-weight:600}
  .step p{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0 0 14px;flex:1}
  .step .stat{border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  .step .stat b{display:block;font-size:28px;line-height:1.1;font-weight:700}
  .step .stat span{display:block;font-size:12px;line-height:1.4;color:var(--muted);margin-top:4px}
  .step .stat + .stat{margin-top:10px}
  .step::after{content:"";position:absolute;right:-12px;top:34px;width:10px;height:10px;border-top:2px solid rgba(255,255,255,.35);border-right:2px solid rgba(255,255,255,.35);transform:rotate(45deg)}
  .step:last-child::after{display:none}
  .aiband{margin-top:16px;border-radius:14px;padding:16px 20px;border:1px dashed rgba(201,133,0,.6);background:rgba(201,133,0,.07);display:flex;gap:28px;align-items:center}
  .aiband .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#f3c66b;flex:none;width:150px;line-height:1.4}
  .aiband div.c{display:flex;align-items:baseline;gap:10px}
  .aiband div.c b{font-size:26px;color:#f3c66b;font-weight:700}
  .aiband div.c span{font-size:13.5px;color:var(--ink-2);line-height:1.4;max-width:300px}

  /* serp */
  .serps{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .serp{border-radius:16px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.1);padding:18px 18px 16px}
  .qbar{display:flex;align-items:center;gap:10px;border-radius:22px;background:rgba(255,255,255,.07);padding:10px 16px;margin:0 0 14px;color:#fff;font-size:15px}
  .qbar i{width:15px;height:15px;border-radius:50%;border:2.5px solid #cfe1fb;position:relative;flex:none}
  .qbar i::after{content:"";position:absolute;right:-6px;bottom:-5px;width:7px;height:2.5px;background:#cfe1fb;transform:rotate(45deg)}
  .blk{border-radius:10px;padding:10px 12px;margin:0 0 9px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
  .blk .t{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 7px}
  .blk .ln{height:8px;border-radius:4px;background:rgba(255,255,255,.16);margin:0 0 6px}
  .blk .ln.s{background:rgba(255,255,255,.09)}
  .blk.ads .t{color:#9b9a94}
  .blk.map{border-color:rgba(25,158,112,.65);background:rgba(25,158,112,.08)}
  .blk.map .t{color:#62d3a9}
  .mapbox{display:grid;grid-template-columns:120px 1fr;gap:10px}
  .mapimg{border-radius:8px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,rgba(255,255,255,.02) 6px 12px);position:relative;height:96px}
  .pin{position:absolute;width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--s2)}
  .firm{display:flex;align-items:center;gap:8px;margin:0 0 7px}
  .firm .ln{flex:1;margin:0}
  .stars{font-size:11px;letter-spacing:1px;color:#f3c66b;flex:none}
  .blk.aio{border-color:rgba(201,133,0,.7);background:rgba(201,133,0,.08)}
  .blk.aio .t{color:#f3c66b}
  .src{display:flex;gap:6px;margin-top:8px}
  .src span{flex:1;height:26px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(243,198,107,.35)}
  .blk.org .t{color:#9fc3f3}
  .blk.dir .t{color:#c3c2b7}
  .tag{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 6px;border-radius:5px;background:rgba(25,158,112,.25);color:#9ff0cf;margin-left:6px;letter-spacing:.04em;text-transform:none}
  .stat2{display:flex;gap:16px;margin-top:12px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  .stat2 div b{display:block;font-size:24px;font-weight:700;line-height:1.1}
  .stat2 div span{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:3px}

  /* plan */
  .phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative}
  .ph{border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);padding:0 0 14px;overflow:hidden}
  .ph .hd{padding:14px 16px 12px}
  .ph .wk{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .ph h3{font-size:17px;line-height:1.3;color:#fff;margin:6px 0 0;font-weight:600}
  .ph ul{list-style:none;margin:4px 0 0;padding:0 16px}
  .ph li{font-size:13.5px;line-height:1.42;color:var(--ink-2);padding:7px 0 7px 18px;position:relative;border-top:1px solid rgba(255,255,255,.06)}
  .ph li::before{content:"";position:absolute;left:0;top:13px;width:8px;height:8px;border-radius:2px;background:currentColor;opacity:.9}
  .timeline{margin-top:18px;position:relative;height:46px}
  .timeline .bar{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--s4),var(--s1) 45%,var(--s3))}
  .timeline .m{position:absolute;top:24px;font-size:12.5px;color:var(--ink-2);transform:translateX(-50%);white-space:nowrap}
  .timeline .d{position:absolute;top:7px;width:16px;height:16px;border-radius:50%;background:#111114;border:3px solid #fff;transform:translateX(-50%)}

  /* page anatomy */
  .anat{display:grid;grid-template-columns:420px 1fr;gap:34px;align-items:start}
  .wire{border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);padding:16px}
  .wb{border-radius:8px;margin:0 0 8px;padding:10px 12px;position:relative;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
  .wb .no{position:absolute;left:-11px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#111114}
  .wb .ln{height:7px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 0 5px}
  .wb .ln.s{background:rgba(255,255,255,.09)}
  .wb .row{display:flex;gap:8px}
  .wb .ph2{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);flex:none}
  .wb .btn{height:30px;border-radius:15px;background:var(--s2);width:150px}
  .wb .box{flex:1;height:34px;border-radius:6px;background:rgba(255,255,255,.07)}
  .legend{display:grid;grid-template-columns:1fr;gap:10px}
  .lg{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
  .lg .no{width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#111114}
  .lg b{display:block;color:#fff;font-size:15.5px;font-weight:600;line-height:1.3}
  .lg span{display:block;color:var(--ink-2);font-size:13.5px;line-height:1.42;margin-top:2px}
</style>
</head>

function section(lang, id, t) {
  const s = document.createElement("div");
  s.className = "fig"; s.id = `${lang}-${id}`;
  s.innerHTML = `<p class="kicker">${t.k}</p><h2>${t.h}</h2><p class="sub">${t.s}</p>`;
  document.getElementById("root").appendChild(s);
  return s;
}
function journey(lang, t) {
  const s = section(lang, "journey", t);
  s.insertAdjacentHTML("beforeend", `<div class="steps">${t.steps.map((x, i) => `
    <div class="step" style="border-top:3px solid var(${x.c})"><p class="n">0${i + 1}</p><h3>${x.h}</h3><p>${x.p}</p>
      ${x.st.map(([b, d]) => `<div class="stat"><b style="color:var(${x.c})">${b}</b><span>${d}</span></div>`).join("")}</div>`).join("")}</div>
    <div class="aiband"><div class="lbl">${t.ai.l}</div>${t.ai.c.map(([b, d]) => `<div class="c"><b>${b}</b><span>${d}</span></div>`).join("")}</div>
    <p class="note">${t.note}</p>`);
}
const ln = (w, s) => `<div class="ln${s ? " s" : ""}" style="width:${w}%"></div>`;
function serp(lang, t) {
  const s = section(lang, "serp", t);
  const a = t.a, b = t.b;
  const pins = [[22, 30], [60, 22], [42, 62]];
  s.insertAdjacentHTML("beforeend", `<div class="serps">
    <div class="serp"><div class="qbar"><i></i>${a.q}</div>
      <div class="blk ads"><p class="t">${a.ads}${a.ver ? `<span class="tag">✓ ${a.ver}</span>` : ""}</p>${ln(80)}${ln(55, 1)}</div>
      <div class="blk map"><p class="t">${a.map}</p><div class="mapbox"><div class="mapimg">${pins.map(([x, y]) => `<div class="pin" style="left:${x}%;top:${y}%"></div>`).join("")}</div>
        <div>${[0, 1, 2].map(() => `<div class="firm">${ln(60)}<span class="stars">★★★★★</span></div><div class="ln s" style="width:70%;margin-bottom:9px"></div>`).join("")}</div></div></div>
      <div class="blk dir"><p class="t">${a.dir}</p>${ln(75)}${ln(50, 1)}</div>
      <div class="blk org"><p class="t">${a.org}</p>${ln(70)}${ln(85, 1)}${ln(60)}${ln(40, 1)}</div>
      <div class="stat2">${a.st.map(([v, d], i) => `<div><b style="color:var(${i ? "--s4" : "--s3"})">${v}</b><span>${d}</span></div>`).join("")}</div>
    </div>
    <div class="serp"><div class="qbar"><i></i>${b.q}</div>
      <div class="blk aio"><p class="t">${b.aio}</p>${ln(95)}${ln(88)}${ln(92)}${ln(60, 1)}<div class="src"><span></span><span></span><span></span></div></div>
      <div class="blk"><p class="t" style="color:#c3c2b7">${b.paa}</p>${ln(70, 1)}${ln(64, 1)}${ln(72, 1)}</div>
      <div class="blk org"><p class="t">${b.org}</p>${ln(70)}${ln(85, 1)}${ln(60)}${ln(40, 1)}</div>
      <div class="stat2">${b.st.map(([v, d]) => `<div><b style="color:var(--s4)">${v}</b><span>${d}</span></div>`).join("")}</div>
    </div></div>
    <p class="note">${t.note}</p>`);
}
function plan(lang, t) {
  const s = section(lang, "plan", t);
  s.insertAdjacentHTML("beforeend", `<div class="phases">${t.ph.map((p) => `
    <div class="ph" style="border-top:3px solid var(${p.c})"><div class="hd"><div class="wk" style="color:var(${p.c})">${p.w}</div><h3>${p.h}</h3></div>
      <ul style="color:var(${p.c})">${p.li.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>
    <div class="timeline"><div class="bar"></div>${t.tl.map(([l, v]) => `<div class="d" style="left:${Math.min(Math.max(v, 0.7), 99.3)}%"></div><div class="m" style="left:${v}%;${v === 0 ? "transform:none" : v === 100 ? "transform:translateX(-100%)" : ""}">${l}</div>`).join("")}</div>
    <p class="note">${t.note}</p>`);
}
function page(lang, t) {
  const s = section(lang, "page", t);
  const cols = ["--s2", "--s4", "--s1", "--s1", "--s3", "--s4", "--s1", "--s2"];
  const wb = [
    `${ln(85)}${ln(60)}`, `${ln(95, 1)}${ln(80, 1)}`, `${ln(90, 1)}${ln(92, 1)}${ln(70, 1)}`, `<div class="row"><div class="box"></div><div class="box"></div><div class="box"></div></div>`,
    `<div class="row"><div class="ph2"></div><div style="flex:1">${ln(60)}${ln(80, 1)}</div></div>`, `${ln(88, 1)}${ln(50, 1)}`, `${ln(70)}${ln(66)}${ln(72)}`, `<div class="row" style="align-items:center"><div class="btn"></div><div class="box"></div></div>`,
  ];
  s.insertAdjacentHTML("beforeend", `<div class="anat"><div class="wire">${wb.map((h, i) => `<div class="wb"><div class="no" style="background:var(${cols[i]})">${i + 1}</div>${h}</div>`).join("")}</div>
    <div class="legend">${t.it.map(([h, d], i) => `<div class="lg"><div class="no" style="background:var(${cols[i]})">${i + 1}</div><div><b>${h}</b><span>${d}</span></div></div>`).join("")}</div></div>
    <p class="note">${t.note}</p>`);
}
for (const lang of ["en", "pl", "ru"]) { journey(lang, T[lang].journey); serp(lang, T[lang].serp); plan(lang, T[lang].plan); page(lang, T[lang].page); }
