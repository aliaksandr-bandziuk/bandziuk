<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Figures for the «ChatGPT SEO» article (24.10.2026). Same surface, type and slots
     as the GEO/AEO/LLM series. Every number is repeated in the text of the article. */
  :root{
    --surface:#111114; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"DejaVu Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:var(--sans)}
  .fig{width:1200px;background:var(--surface);padding:44px 48px 40px;margin:0 0 30px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h2{font-size:26px;line-height:1.25;font-weight:600;color:var(--ink);margin:0 0 6px}
  .sub{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0 0 26px;max-width:86ch}
  .note{font-size:13px;color:var(--muted);margin:22px 0 0;line-height:1.5}

  /* flow */
  .steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;position:relative}
  .step{border-radius:14px;padding:18px 16px 16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;position:relative}
  .step .n{flex:none !important;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em;margin:0 0 10px}
  .step h3{font-size:16.5px;line-height:1.3;color:#fff;margin:0 0 10px;font-weight:600}
  .step p{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0 0 14px;flex:1}
  .step .stat{border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  .step .stat b{display:block;font-size:24px;line-height:1.1;font-weight:700}
  .step .stat span{display:block;font-size:12px;line-height:1.4;color:var(--muted);margin-top:4px}
  .step::after{content:"";position:absolute;right:-12px;top:34px;width:10px;height:10px;border-top:2px solid rgba(255,255,255,.35);border-right:2px solid rgba(255,255,255,.35);transform:rotate(45deg)}
  .step:last-child::after{display:none}
  .pills{display:flex;flex-direction:column;gap:5px;margin:0 0 14px}
  .pills i{font-style:normal;font-family:var(--mono);font-size:11.5px;line-height:1.4;padding:4px 8px;border-radius:7px;background:rgba(57,135,229,.14);color:#cfe1fb}
  .pills i em{font-style:normal;color:#ffb38d}

  /* bars */
  .bars{display:grid;grid-template-columns:150px 1fr 70px;gap:12px 16px;align-items:center}
  .bars .w{font-family:var(--mono);font-size:15px;color:#fff;text-align:right}
  .bars .track{height:26px;border-radius:6px;background:rgba(255,255,255,.04);position:relative}
  .bars .fill{height:100%;border-radius:6px;background:var(--s1)}
  .bars .fill.hot{background:var(--s2)}
  .bars .v{font-size:15px;font-weight:600;color:#fff}

  /* english */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 0 26px}
  .card{border-radius:16px;padding:22px 24px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1)}
  .card b{display:block;font-size:56px;line-height:1;font-weight:700;margin:0 0 10px}
  .card span{font-size:15px;line-height:1.45;color:var(--ink-2)}
  .range h3{font-size:15px;color:var(--ink-2);font-weight:500;margin:0 0 14px}
  .scale{position:relative;height:74px}
  .scale .axis{position:absolute;left:0;right:0;top:34px;height:2px;background:var(--baseline)}
  .scale .band{position:absolute;top:26px;height:18px;border-radius:9px;background:rgba(201,133,0,.35);border:1px solid var(--s4)}
  .scale .tick{position:absolute;top:50px;font-size:12px;color:var(--muted);transform:translateX(-50%);font-family:var(--mono)}
  .scale .mk{position:absolute;top:0;transform:translateX(-50%);font-size:13.5px;color:#fff;font-weight:600;white-space:nowrap}
  .scale .dot{position:absolute;top:28px;width:14px;height:14px;border-radius:50%;background:var(--s4);transform:translateX(-50%);border:2px solid #111114}
  .scale .floor{position:absolute;top:20px;height:30px;border-left:2px dashed var(--s2)}
  .scale .floorl{position:absolute;top:2px;font-size:12.5px;color:#ffb38d;transform:translateX(calc(-100% - 10px));white-space:nowrap}
</style>
</head>

function section(lang, id, t) {
  const s = document.createElement("div");
  s.className = "fig"; s.id = `${lang}-${id}`;
  s.innerHTML = `<p class="kicker">${t.k}</p><h2>${t.h}</h2><p class="sub">${t.s}</p>`;
  document.getElementById("root").appendChild(s);
  return s;
}
function flow(lang, t) {
  const s = section(lang, "flow", t);
  s.insertAdjacentHTML("beforeend", `<div class="steps">${t.steps.map((x, i) => `
    <div class="step" style="border-top:3px solid var(${x.c})"><p class="n">0${i + 1}</p><h3>${x.h}</h3>
      ${x.pills ? `<div class="pills">${x.pills.map((p) => `<i>${p}</i>`).join("")}</div>` : ""}
      <p>${x.p}</p>
      <div class="stat"><b style="color:var(${x.c});${x.small ? "font-size:16px;font-family:var(--mono)" : ""}">${x.b}</b><span>${x.t}</span></div></div>`).join("")}</div>
    <p class="note">${t.note}</p>`);
}
function words(lang, t) {
  const s = section(lang, "words", t);
  const max = 16;
  const fmt = (v) => (lang === "en" ? v.toFixed(2) : v.toFixed(2).replace(".", ",")) + "%";
  s.insertAdjacentHTML("beforeend", `<div class="bars">${t.rows.map(([w, v], i) => `
    <div class="w">${w}</div><div class="track"><div class="fill${i === 0 ? " hot" : ""}" style="width:${(v / max) * 100}%"></div></div><div class="v">${fmt(v)}</div>`).join("")}</div>
    <p class="note">${t.note}</p>`);
}
function eng(lang, t) {
  const s = section(lang, "eng", t);
  const x = (v) => ((v - 50) / 50) * 100; // axis 50–100%
  s.insertAdjacentHTML("beforeend", `<div class="cards">${t.cards.map(([b, d]) => `<div class="card"><b style="color:var(--s1)">${b}</b><span>${d}</span></div>`).join("")}</div>
    <div class="range"><h3>${t.rh}</h3><div class="scale">
      <div class="axis"></div>
      <div class="band" style="left:${x(66)}%;width:${x(94) - x(66)}%"></div>
      ${t.marks.map(([l, v]) => `<div class="dot" style="left:${x(v)}%"></div><div class="mk" style="left:${x(v)}%">${l}</div>`).join("")}
      <div class="floor" style="left:${x(60)}%"></div><div class="floorl" style="left:${x(60)}%">${t.floor}</div>
      ${[50, 60, 70, 80, 90, 100].map((v) => `<div class="tick" style="left:${Math.min(Math.max(x(v), 1.5), 98.5)}%">${v}%</div>`).join("")}
    </div></div>
    <p class="note">${t.note}</p>`);
}
for (const lang of ["en", "pl", "ru"]) { flow(lang, T[lang].flow); words(lang, T[lang].words); eng(lang, T[lang].eng); }
