<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Figures for the «GEO vs SEO» article (23.10.2026). Same surface, type and
     categorical slots as figures-i18n.html (the 141-answer study), so the two
     articles read as one series. Every number traces to a named source; the
     article repeats each figure's numbers in a table or in the text. */
  :root{
    --surface:#111114; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"DejaVu Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:var(--sans)}
  .fig{width:1200px;background:var(--surface);padding:44px 48px 40px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h2{font-size:26px;line-height:1.25;font-weight:600;color:var(--ink);margin:0 0 6px}
  .sub{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0 0 26px;max-width:86ch}
  .note{font-size:13px;color:var(--muted);margin:20px 0 0;line-height:1.5}
  .legend{display:flex;gap:20px;flex-wrap:wrap;margin:0 0 18px}
  .legend span{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
  .legend i{width:12px;height:12px;border-radius:3px;display:block}
  text{font-family:var(--sans)}
  .lbl{fill:var(--ink);font-size:15px;font-weight:500}
  .lbl2{fill:var(--ink-2);font-size:13px}
  .val{fill:var(--ink);font-size:15px;font-weight:600}
  .ax{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

  /* layers */
  .layers{display:flex;flex-direction:column;gap:14px}
  .layer{display:grid;grid-template-columns:150px 1fr 1fr 1fr;gap:0;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .layer .name{display:flex;flex-direction:column;justify-content:center;padding:20px 22px;color:#fff}
  .layer .name b{font-size:30px;font-weight:600;line-height:1}
  .layer .name small{font-size:12px;opacity:.85;margin-top:6px;line-height:1.3}
  .layer .cell{padding:18px 20px;background:rgba(255,255,255,.03);border-left:1px solid rgba(255,255,255,.06)}
  .layer .cell .h{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
  .layer .cell p{margin:0;font-size:15px;line-height:1.42;color:var(--ink)}
  .arrow{font-size:13px;color:var(--muted);margin:2px 0 0 4px}

  /* clicks */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .panel{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:22px 24px}
  .panel .ph{font-size:15px;font-weight:600;color:var(--ink);margin:0 0 4px}
  .panel .ps{font-size:13px;color:var(--muted);margin:0 0 14px;line-height:1.45}
  .big{font-size:64px;font-weight:600;color:var(--s2);line-height:1;margin:6px 0 8px}

  /* matrix */
  table.m{width:100%;border-collapse:collapse;font-size:15px}
  table.m th{font-weight:500;color:var(--ink-2);font-size:13px;text-align:center;padding:0 8px 12px;border-bottom:1px solid var(--baseline)}
  table.m th:first-child{text-align:left;padding-left:0}
  table.m td{padding:9px 8px;border-bottom:1px solid var(--grid);text-align:center;color:var(--ink)}
  table.m td:first-child{text-align:left;padding-left:0}
  table.m tr.all td{background:rgba(57,135,229,.10)}
  .dot{display:inline-block;width:16px;height:16px;border-radius:50%}
  .o{background:var(--s4)} .a{background:var(--s1)} .p{background:var(--s3)}
  .no{display:inline-block;width:16px;height:2px;background:var(--grid);vertical-align:middle}
  .cg{margin-top:16px;padding:14px 18px;border-radius:12px;background:rgba(217,89,38,.08);border:1px solid rgba(217,89,38,.3);font-size:14px;color:var(--ink-2);line-height:1.45}
  .cg b{color:var(--ink)}
</style>
</head>

const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const S = getComputedStyle(document.documentElement);
const c = (n) => S.getPropertyValue(n).trim();
const txt = (svg, x, y, s, cls, anchor = "start") => { const t = el("text", { x, y, class: cls, "text-anchor": anchor }); t.textContent = s; svg.appendChild(t); return t; };
const bar = (x, y, w, h, r = 4) => {
  // rounded on the far end only; negative widths grow to the left
  if (w >= 0) { r = Math.min(r, w); return `M${x},${y} H${x + w - r} A${r},${r} 0 0 1 ${x + w},${y + r} V${y + h - r} A${r},${r} 0 0 1 ${x + w - r},${y + h} H${x} Z`; }
  w = -w; r = Math.min(r, w); return `M${x},${y} H${x - w + r} A${r},${r} 0 0 0 ${x - w},${y + r} V${y + h - r} A${r},${r} 0 0 0 ${x - w + r},${y + h} H${x} Z`;
};

function section(lang, id, t) {
  const s = document.createElement("section");
  s.className = "fig"; s.id = `${lang}-${id}`;
  s.innerHTML = `<p class="kicker">${t.k}</p><h2>${t.h}</h2><p class="sub">${t.s}</p>`;
  return s;
}
const note = (s, n) => { const p = document.createElement("p"); p.className = "note"; p.textContent = n; s.appendChild(p); };

function layers(lang, t) {
  const L = t.layers, s = section(lang, "layers", L);
  const hues = [c("--s1"), c("--s3"), c("--s4")];
  const box = document.createElement("div"); box.className = "layers";
  L.rows.forEach((r, i) => {
    box.insertAdjacentHTML("beforeend", `
      <div class="layer">
        <div class="name" style="background:${hues[i]}"><b>${r[0]}</b><small>${r[1]}</small></div>
        <div class="cell"><p class="h">${L.head[0]}</p><p>${r[2]}</p></div>
        <div class="cell"><p class="h">${L.head[1]}</p><p>${r[3]}</p></div>
        <div class="cell"><p class="h">${L.head[2]}</p><p>${r[4]}</p></div>
      </div>`);
  });
  s.appendChild(box); note(s, L.note);
  return s;
}

function clicks(lang, t) {
  const C = t.clicks, s = section(lang, "clicks", C);
  const wrap = document.createElement("div"); wrap.className = "two";
  const p1 = document.createElement("div"); p1.className = "panel";
  p1.innerHTML = `<p class="ph">${C.p1h}</p><p class="ps">${C.p1s}</p>`;
  const svg = el("svg", { width: 500, height: 210 });
  const padT = 4, band = 66, barH = 20, W = 420, max = 16;
  C.bars.forEach(([label, v], i) => {
    const y = padT + i * band;
    txt(svg, 0, y + 14, label, "lbl2");
    svg.appendChild(el("path", { d: bar(0, y + 24, (v / max) * W, barH), fill: i === 0 ? c("--muted") : c("--s2") }));
    txt(svg, (v / max) * W + 10, y + 40, `${v}%`, "val");
  });
  p1.appendChild(svg);
  const p2 = document.createElement("div"); p2.className = "panel";
  p2.innerHTML = `<p class="ph">${C.p2h}</p><p class="ps">${C.p2s}</p><p class="big">${C.big}</p><p class="ps" style="margin:0">${C.bigc}</p>`;
  wrap.appendChild(p1); wrap.appendChild(p2); s.appendChild(wrap); note(s, C.note);
  return s;
}

function matrix(lang, t) {
  const M = t.matrix, s = section(lang, "matrix", M);
  const kinds = ["o", "a", "p"];
  const rows = M.rows.map((r) => {
    const all = r[1] && r[2] && r[3];
    return `<tr class="${all ? "all" : ""}"><td>${r[0]}</td>${[1, 2, 3].map((j) => `<td>${r[j] ? `<span class="dot ${kinds[j - 1]}"></span>` : `<span class="no"></span>`}</td>`).join("")}</tr>`;
  }).join("");
  s.insertAdjacentHTML("beforeend", `<table class="m"><thead><tr>${M.cols.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table><div class="cg">${M.cg}</div>`);
  note(s, M.note);
  return s;
}

function methods(lang, t) {
  const M = t.methods, s = section(lang, "methods", M);
  const svg = el("svg", { width: 1104, height: 9 * 40 + 40 });
  const labelEnd = 290, zero = 480, W = 1104 - zero - 90, max = 45, band = 40, barH = 20, top = 6;
  [-10, 0, 10, 20, 30, 40].forEach((v) => {
    const x = zero + (v / max) * W;
    svg.appendChild(el("line", { x1: x, y1: top, x2: x, y2: top + band * 9 - 10, stroke: v === 0 ? c("--baseline") : c("--grid"), "stroke-width": 1 }));
    txt(svg, x, top + band * 9 + 12, `${v > 0 ? "+" : ""}${v}%`, "ax", "middle");
  });
  M.rows.forEach(([name, v], i) => {
    const y = top + i * band + (band - barH) / 2 - 4;
    svg.appendChild(el("path", { d: bar(zero, y, (v / max) * W, barH), fill: v < 0 ? c("--s2") : c("--s1") }));
    txt(svg, labelEnd, y + 15, name, "lbl", "end");
    const vx = v < 0 ? zero + (v / max) * W - 10 : zero + (v / max) * W + 10;
    txt(svg, vx, y + 15, `${v > 0 ? "+" : "−"}${Math.abs(v)}%`, "val", v < 0 ? "end" : "start");
  });
  s.appendChild(svg); note(s, M.note);
  return s;
}

function rank(lang, t) {
  const R = t.rank, s = section(lang, "rank", R);
  const leg = document.createElement("div"); leg.className = "legend";
  leg.innerHTML = `<span><i style="background:${c("--s3")}"></i>${R.leg[0]}</span><span><i style="background:${c("--s2")}"></i>${R.leg[1]}</span>`;
  s.appendChild(leg);
  const svg = el("svg", { width: 1104, height: 3 * 84 + 30 });
  const padL = 300, zero = 580, W = 1104 - zero - 110, max = 125, band = 84, barH = 22, top = 4;
  [-25, 0, 25, 50, 75, 100].forEach((v) => {
    const x = zero + (v / max) * W;
    svg.appendChild(el("line", { x1: x, y1: top, x2: x, y2: top + band * 3 - 8, stroke: v === 0 ? c("--baseline") : c("--grid"), "stroke-width": 1 }));
    txt(svg, x, top + band * 3 + 12, `${v > 0 ? "+" : ""}${v}%`, "ax", "middle");
  });
  R.rows.forEach(([name, a, b], i) => {
    const y = top + i * band + 10;
    txt(svg, padL - 10, y + 30, name, "lbl", "end");
    [[a, c("--s3")], [b, c("--s2")]].forEach(([v, col], j) => {
      const yy = y + j * (barH + 6);
      svg.appendChild(el("path", { d: bar(zero, yy, (v / max) * W, barH), fill: col }));
      const vx = v < 0 ? zero + (v / max) * W - 10 : zero + (v / max) * W + 10;
      txt(svg, vx, yy + 16, `${v > 0 ? "+" : "−"}${t.num(Math.abs(Math.round(v)))}%`, "val", v < 0 ? "end" : "start");
    });
  });
  s.appendChild(svg); note(s, R.note);
  return s;
}

const root = document.getElementById("root");
for (const lang of ["en", "pl", "ru"]) {
  const t = T[lang];
  [layers, clicks, matrix, methods, rank].forEach((f) => root.appendChild(f(lang, t)));
}
</script>
</body>
