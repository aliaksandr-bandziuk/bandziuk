<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Textless cover for «LLM SEO» (no wording on the preview, which is also the OG
     image). The same page twice: on the left as a browser shows it, full of text;
     on the right as an AI crawler that does not run JavaScript receives it — the
     frame is there, the content is not. Palette and geometry as the GEO/AEO covers. */
  :root{ --bg:#0a0a0b; --accent:#f5a05c; --warm:#d95926; --cool:#3987e5; --line:#26262a; }
  *{box-sizing:border-box}
  body{margin:0;background:#000}
  .cover{position:relative;width:1672px;height:941px;overflow:hidden;
    background:
      radial-gradient(900px 560px at 18% -10%, rgba(57,135,229,.18), transparent 62%),
      radial-gradient(900px 560px at 88% 112%, rgba(217,89,38,.16), transparent 60%),
      var(--bg);}
  .grain{position:absolute;inset:0;opacity:.4}
  .grain i{position:absolute;border-radius:50%;background:#fff}
  .pair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:90px;align-items:stretch}
  .win{width:560px;border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
  .win .bar{height:52px;display:flex;align-items:center;gap:10px;padding:0 22px}
  .win .bar i{width:11px;height:11px;border-radius:50%;display:block}
  .win .bar span{margin-left:12px;height:22px;flex:1;border-radius:11px}
  .full{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 100px rgba(0,0,0,.55)}
  .full .bar{background:#17171a;border-bottom:1px solid rgba(255,255,255,.07)}
  .full .bar i{background:#2e2e33} .full .bar span{background:rgba(255,255,255,.06)}
  .full .body{padding:34px 36px 40px}
  .full .hero{height:120px;border-radius:14px;margin:0 0 26px;background:linear-gradient(135deg, rgba(57,135,229,.55), rgba(57,135,229,.12))}
  .l{height:12px;border-radius:6px;background:rgba(255,255,255,.3);margin:0 0 13px}
  .l.sm{height:8px;background:rgba(255,255,255,.16)}
  .cards{display:flex;gap:14px;margin-top:22px}
  .cards div{flex:1;height:70px;border-radius:12px;background:rgba(255,255,255,.07)}
  .ghost{border:2px dashed rgba(217,89,38,.6);background:rgba(217,89,38,.04)}
  .ghost .bar{border-bottom:2px dashed rgba(217,89,38,.35)}
  .ghost .bar i{border:2px solid rgba(217,89,38,.5)} .ghost .bar span{border:2px dashed rgba(217,89,38,.35)}
  .ghost .body{flex:1;display:flex;align-items:center;justify-content:center}
  .ghost .tag{font:700 54px/1 "DejaVu Sans Mono",monospace;color:rgba(217,89,38,.75);letter-spacing:-2px}
  .arrow{position:absolute;left:50%;top:50%;width:58px;height:4px;background:rgba(255,255,255,.35);transform:translate(-50%,-50%);border-radius:2px}
  .arrow::after{content:"";position:absolute;right:-2px;top:50%;width:16px;height:16px;border-top:4px solid rgba(255,255,255,.35);border-right:4px solid rgba(255,255,255,.35);transform:translateY(-50%) rotate(45deg)}
</style>
</head>
<body>
<div id="root"></div>
<script>
function grain(n) {
  let s = 20261026, out = "";
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < n; i++) {
    const x = (rnd() * 1672).toFixed(0), y = (rnd() * 941).toFixed(0);
    const d = (rnd() * 1.6 + 0.6).toFixed(2), o = (rnd() * 0.3 + 0.05).toFixed(2);
    out += `<i style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;opacity:${o}"></i>`;
  }
  return out;
}
document.getElementById("root").insertAdjacentHTML("beforeend", `
  <div class="cover" id="cover">
    <div class="grain">${grain(240)}</div>
    <div class="pair">
      <div class="win full"><div class="bar"><i></i><i></i><i></i><span></span></div>
        <div class="body"><div class="hero"></div>
          <div class="l" style="width:86%"></div><div class="l" style="width:64%"></div>
          <div class="l sm" style="width:94%"></div><div class="l sm" style="width:88%"></div><div class="l sm" style="width:70%"></div>
          <div class="cards"><div></div><div></div><div></div></div>
        </div></div>
      <div class="win ghost"><div class="bar"><i></i><i></i><i></i><span></span></div>
        <div class="body"><span class="tag">&lt;/&gt;</span></div></div>
    </div>
    <div class="arrow"></div>
  </div>`);
</script>
</body>
</html>
