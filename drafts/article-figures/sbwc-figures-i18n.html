<style>
  /* Figures for «How much a small business website costs» (29.10.2026). Same surface,
     type and slots as the rest of the series. NO invented price figures: the article
     deliberately quotes no vendor prices, so the figures show the STRUCTURE of the
     cost. The only money shown is the author's own starting price. */
  :root{
    --surface:#111114; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"DejaVu Sans Mono",ui-monospace,monospace;

  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:var(--sans)}
  .fig{width:1200px;background:var(--surface);padding:44px 48px 40px;margin:0 0 30px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h2{font-size:26px;line-height:1.25;font-weight:600;color:var(--ink);margin:0 0 6px}
  .sub{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0 0 26px;max-width:86ch}
  .note{font-size:13px;color:var(--muted);margin:22px 0 0;line-height:1.5}

  /* bands */
  .bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .band{border-radius:14px;padding:18px 16px 16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column}
  .band .n{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em;margin:0 0 10px}
  .band h3{font-size:16.5px;line-height:1.3;color:#fff;margin:0 0 10px;font-weight:600}
  .band p{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0 0 14px;flex:1}
  .band dl{margin:0;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  .band dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
  .band dd{margin:0 0 11px;font-size:13.5px;line-height:1.35;color:#fff}
  .band dd:last-child{margin-bottom:0}
  .band dd b{font-weight:700}

  /* once vs yearly */
  .two{display:grid;grid-template-columns:1fr 1.25fr;gap:26px;align-items:start}
  .pane{border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);padding:22px 24px}
  .pane .ph{font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
  .once{text-align:center;padding:34px 24px}
  .once b{display:block;font-size:40px;font-weight:700;color:#fff;line-height:1.1}
  .once span{display:block;font-size:14px;color:var(--ink-2);margin-top:10px;line-height:1.45}
  .rows{display:flex;flex-direction:column;gap:9px}
  .r{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;border-radius:10px;padding:11px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .r .l{font-size:14px;color:#fff;line-height:1.35}
  .r .l em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:3px}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:5px 10px;border-radius:20px;white-space:nowrap;flex:none}
  .tag.must{background:rgba(217,89,38,.18);color:#ffa882;border:1px solid rgba(217,89,38,.5)}
  .tag.may{background:rgba(201,133,0,.16);color:#f3c66b;border:1px solid rgba(201,133,0,.45)}
  .tag.zero{background:rgba(25,158,112,.16);color:#71dfb3;border:1px solid rgba(25,158,112,.5)}

  /* quote anatomy */
  .quotes{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .doc{border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.03);padding:24px 26px;min-height:360px}
  .doc.good{border-color:rgba(25,158,112,.55);background:rgba(25,158,112,.06)}
  .doc.bad{border-color:rgba(217,89,38,.45);background:rgba(217,89,38,.05)}
  .doc .dh{font-size:15px;color:#fff;font-weight:600;margin:0 0 4px}
  .doc .dsub{font-size:12.5px;color:var(--muted);margin:0 0 18px}
  .li{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;margin:0 0 13px}
  .li i{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none;font-style:normal;margin-top:1px}
  .li.y i{background:rgba(25,158,112,.9);color:#06281c}
  .li.n i{background:rgba(255,255,255,.12);color:var(--muted)}
  .li span{font-size:13.5px;line-height:1.42;color:var(--ink-2)}
  .li.n span{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
  .oneline{margin-top:26px;border-radius:10px;border:1px dashed rgba(217,89,38,.6);background:rgba(217,89,38,.08);padding:18px 20px;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  .oneline span{font-size:15px;color:#fff}
  .oneline b{font-family:var(--mono);font-size:17px;color:#ffa882}

  /* industries */
  .grid6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .ind{border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);padding:18px 18px 16px;border-left:3px solid var(--s1)}
  .ind h3{font-size:15.5px;color:#fff;margin:0 0 8px;font-weight:600;line-height:1.3}
  .ind p{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0}
</style>
</head>

        one: ["Сайт", "— — — €"] },
      note: "Ещё два вопроса, которые стоит задать вслух: можно ли посмотреть сайт, который до сих пор работает и которым пользуются, и что будет, если мы перестанем работать вместе." },

    ind: { k: "Что меняет цену в зависимости от отрасли", h: "Почему одни и те же пять страниц стоят по-разному в разных отраслях",
      s: "Цена идёт за тем, что сайт обязан уметь, прежде чем вообще начнёт работать. Каждый пункт — настоящий множитель, а не наценка.",
      items: [
        { h: "Салон красоты", p: "Запись, прайс, который меняется постоянно, страницы мастеров, которые должны быть свежими.", c: "--s2" },
        { h: "Строительная компания", p: "Объекты с фотографиями, города, где вы строите, доверие при крупной сумме сделки.", c: "--s4" },
        { h: "Автосервис", p: "Услуги по маркам, цены и путь для того, у кого машина встала сегодня утром.", c: "--s1" },
        { h: "Психолог или терапевт", p: "Образование, конфиденциальность и первый контакт, который не похож на анкету.", c: "--s3" },
        { h: "Агентство недвижимости", p: "Объекты, поиск и актуальность данных — часть, которая не перестаёт стоить денег.", c: "--s1" },
        { h: "Многоязычный бизнес", p: "Второй комплект страниц, написанный под тот рынок и поддерживаемый наравне с первым.", c: "--s4" },
      ],
      note: "По каждой из этих отраслей есть отдельная статья с тем, что поднимает цену именно там." },

};

function section(lang, id, t) {
  const s = document.createElement("div");
  s.className = "fig"; s.id = `${lang}-${id}`;
  s.innerHTML = `<p class="kicker">${t.k}</p><h2>${t.h}</h2><p class="sub">${t.s}</p>`;
  document.getElementById("root").appendChild(s);
  return s;
}
function bands(lang, t) {
  const s = section(lang, "bands", t);
  s.insertAdjacentHTML("beforeend", `<div class="bands">${t.items.map((x, i) => `
    <div class="band" style="border-top:3px solid var(${x.c})"><p class="n">0${i + 1}</p><h3>${x.h}</h3><p>${x.p}</p>
      <dl>${x.d.map((v, k) => `<dt>${t.cols[k]}</dt><dd>${v}</dd>`).join("")}</dl></div>`).join("")}</div>
    <p class="note">${t.note}</p>`);
}
function cost(lang, t) {
  const s = section(lang, "cost", t);
  s.insertAdjacentHTML("beforeend", `<div class="two">
    <div class="pane once"><b>${t.once.b}</b><span>${t.once.s}</span></div>
    <div class="pane"><p class="ph">${t.ph}</p><div class="rows">${t.rows.map(([l, d, cls, tag]) => `
      <div class="r"><div class="l">${l}<em>${d}</em></div><div class="tag ${cls}">${tag}</div></div>`).join("")}</div></div></div>
    <p class="note">${t.note}</p>`);
}
function quote(lang, t) {
  const s = section(lang, "quote", t);
  s.insertAdjacentHTML("beforeend", `<div class="quotes">
    <div class="doc good"><p class="dh">${t.good.h}</p><p class="dsub">${t.good.s}</p>
      ${t.good.li.map((x) => `<div class="li y"><i>✓</i><span>${x}</span></div>`).join("")}</div>
    <div class="doc bad"><p class="dh">${t.bad.h}</p><p class="dsub">${t.bad.s}</p>
      ${t.bad.li.map((x) => `<div class="li n"><i>—</i><span>${x}</span></div>`).join("")}
      <div class="oneline"><span>${t.bad.one[0]}</span><b>${t.bad.one[1]}</b></div></div></div>
    <p class="note">${t.note}</p>`);
}
function ind(lang, t) {
  const s = section(lang, "ind", t);
  s.insertAdjacentHTML("beforeend", `<div class="grid6">${t.items.map((x) => `
    <div class="ind" style="border-left-color:var(${x.c})"><h3>${x.h}</h3><p>${x.p}</p></div>`).join("")}</div>
    <p class="note">${t.note}</p>`);
}
for (const lang of ["en", "pl", "ru"]) { bands(lang, T[lang].bands); cost(lang, T[lang].cost); quote(lang, T[lang].quote); ind(lang, T[lang].ind); }
</script>
