<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Фигуры к статье «За что именно платит клиент в SEO-аудите» (3.11.2026).
     Та же подложка и типографика, что в серии GEO/AEO/LLM/ChatGPT, но крупнее:
     тело 17px вместо 13.5, цифры до 64px, меньше элементов на картинку. */
  :root{
    --surface:#111114; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"DejaVu Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:var(--sans)}
  .fig{width:720px;background:var(--surface);padding:34px 34px 30px;margin:0 0 24px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  h2{font-size:25px;line-height:1.25;font-weight:600;color:var(--ink);margin:0 0 8px}
  .sub{font-size:16px;line-height:1.5;color:var(--ink-2);margin:0 0 22px}
  .note{font-size:14px;color:var(--muted);margin:20px 0 0;line-height:1.5}

  /* фигура 1 — пять частей одной находки, строками, чтобы шрифт был крупным */
  .rows{display:flex;flex-direction:column;gap:10px}
  .row{display:grid;grid-template-columns:40px 1fr;gap:16px;align-items:start;
       background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);
       border-radius:12px;padding:16px 18px}
  .row .n{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--muted);line-height:1.2}
  .row h3{font-size:18px;line-height:1.3;color:#fff;margin:0 0 6px;font-weight:600;display:inline-block;margin-right:10px}
  .row .tag{display:inline-block;font-family:var(--mono);font-size:11px;vertical-align:2px;
            letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:6px}
  .row p{font-size:16px;line-height:1.5;color:var(--ink-2);margin:0}
  .t-m{background:rgba(217,89,38,.16);color:#ffb38d}
  .t-j{background:rgba(255,255,255,.07);color:var(--muted)}
  .t-a{background:rgba(57,135,229,.16);color:#cfe1fb}

  /* фигура 2 — что аудит убрал */
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:0 0 22px}
  .card{border-radius:14px;padding:18px 16px 16px;background:rgba(255,255,255,.035);
        border:1px solid rgba(255,255,255,.1)}
  .card b{display:block;font-size:40px;line-height:1;font-weight:700;margin:0 0 9px;color:#fff}
  .card b.off{color:var(--muted)}
  .card b.on{color:var(--s2)}
  .card span{font-size:14.5px;line-height:1.4;color:var(--ink-2);display:block}
  .barwrap{margin:0}
  .barlab{display:flex;justify-content:space-between;font-size:14.5px;color:var(--ink-2);margin:0 0 8px;gap:12px}
  .barlab .hot{color:var(--s2);font-weight:600}
  .track{height:32px;border-radius:8px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;background:var(--s2);border-radius:8px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const T = {
 en: {
  f1: { k: "What the fee buys · one finding, five parts",
        h: "What you are paying for: the five parts of one finding",
        s: "A free tool gives you problem number one and stops. Everything below it is the work, and it is what the fee is for.",
        rows: [
          { h: "The measurement", tag: "Measured", cls: "t-m", p: "The number, the source it came from and the date it was taken, so you can open the same place and check it yourself." },
          { h: "The cause", tag: "Interpretation", cls: "t-j", p: "Why the number is what it is — marked as judgement, because this is the part of any audit most likely to be wrong." },
          { h: "The action", tag: "What to do", cls: "t-a", p: "What exactly to change, and how many hours it takes. Not «improve the content»." },
          { h: "The expected result", tag: "And the condition", cls: "t-a", p: "What should change, by when, and the condition it depends on — including what would prove it wrong." },
          { h: "The date you can check it", tag: "Verification", cls: "t-a", p: "Where the result will be visible and when, so the promise can be settled rather than argued." },
        ],
        note: "A finding missing any one of the five cannot be acted on or verified." },
  f2: { k: "A real audit · 645 pages, three languages · November 2026",
        h: "An audit that removed work: 978 planned pages became 41",
        s: "Checking who actually searches, before writing anything, cancelled nine clusters out of the plan the site walked in with.",
        cards: [ { v: "978", c: "", s: "pages the plan contained before the audit" },
                 { v: "623", c: "off", s: "cancelled: the searcher is a consumer, not a business owner" },
                 { v: "41", c: "on", s: "pages that survived and are worth writing" } ],
        barA: "Monthly searches in the original plan: 182,410",
        barB: "kept: 6,410",
        note: "The work this audit removed is larger than the work it recommends." },
 },
 pl: {
  f1: { k: "Za co płacisz · jedno ustalenie, pięć części",
        h: "Za co płacisz: pięć części jednego ustalenia",
        s: "Darmowe narzędzie daje problem numer jeden i na tym kończy. Wszystko poniżej to praca i to za nią jest ta opłata.",
        rows: [
          { h: "Pomiar", tag: "Zmierzone", cls: "t-m", p: "Liczba, jej źródło i data odczytu, żebyś mógł otworzyć to samo miejsce i sprawdzić sam." },
          { h: "Przyczyna", tag: "Interpretacja", cls: "t-j", p: "Dlaczego liczba jest taka — oznaczone jako osąd, bo to ta część audytu najczęściej bywa błędna." },
          { h: "Działanie", tag: "Co zrobić", cls: "t-a", p: "Co dokładnie zmienić i ile godzin to zajmie. Nie «popraw treść»." },
          { h: "Spodziewany rezultat", tag: "I warunek", cls: "t-a", p: "Co ma się zmienić, do kiedy i od czego to zależy — razem z tym, co obaliłoby prognozę." },
          { h: "Data, w której to sprawdzisz", tag: "Weryfikacja", cls: "t-a", p: "Gdzie i kiedy rezultat będzie widoczny, żeby obietnicę dało się rozliczyć, a nie przedyskutować." },
        ],
        note: "Ustalenie bez którejkolwiek z pięciu części jest niewykonalne i niesprawdzalne." },
  f2: { k: "Prawdziwy audyt · 645 podstron, trzy języki · listopad 2026",
        h: "Audyt, który usunął pracę: z 978 planowanych podstron zostało 41",
        s: "Sprawdzenie, kto naprawdę szuka, zanim cokolwiek powstało, skreśliło dziewięć klastrów z planu, z którym strona przyszła.",
        cards: [ { v: "978", c: "", s: "podstron zawierał plan przed audytem" },
                 { v: "623", c: "off", s: "skreślone: szuka konsument, a nie właściciel firmy" },
                 { v: "41", c: "on", s: "podstrony, które przetrwały i warto je napisać" } ],
        barA: "Wyszukiwania miesięcznie w pierwotnym planie: 182 410",
        barB: "zostaje: 6 410",
        note: "Praca, którą ten audyt usunął, jest większa niż praca, którą rekomenduje." },
 },
 ru: {
  f1: { k: "За что платит клиент · одна находка, пять частей",
        h: "За что вы платите: пять частей одной находки",
        s: "Бесплатный инструмент выдаёт проблему номер один и на этом останавливается. Всё, что ниже, — это работа, и деньги именно за неё.",
        rows: [
          { h: "Измерение", tag: "Измерено", cls: "t-m", p: "Цифра, её источник и дата съёма, чтобы вы открыли то же место и проверили сами." },
          { h: "Причина", tag: "Толкование", cls: "t-j", p: "Почему цифра такая — помечено как суждение, потому что именно эта часть аудита чаще всего оказывается неверной." },
          { h: "Действие", tag: "Что делать", cls: "t-a", p: "Что именно поменять и сколько это часов. Не «улучшить контент»." },
          { h: "Ожидаемый результат", tag: "И условие", cls: "t-a", p: "Что должно измениться, к какому сроку и при каком условии — вместе с тем, что опровергло бы прогноз." },
          { h: "Дата, когда вы это проверите", tag: "Проверка", cls: "t-a", p: "Где и когда результат будет виден, чтобы обещание можно было закрыть, а не обсуждать." },
        ],
        note: "Находка без любой из пяти частей невыполнима и непроверяема." },
  f2: { k: "Настоящий аудит · 645 страниц, три языка · ноябрь 2026",
        h: "Аудит, который убрал работу: из 978 запланированных страниц осталась 41",
        s: "Проверка того, кто на самом деле ищет, до написания хоть одной страницы вычеркнула из плана девять кластеров.",
        cards: [ { v: "978", c: "", s: "страниц было в плане до аудита" },
                 { v: "623", c: "off", s: "отменены: ищет потребитель, а не владелец бизнеса" },
                 { v: "41", c: "on", s: "страницы, которые уцелели и стоят работы" } ],
        barA: "Запросов в месяц в исходном плане: 182 410",
        barB: "осталось: 6 410",
        note: "Работа, которую этот аудит убрал, больше той, которую он рекомендует." },
 },
};

const LANG = new URLSearchParams(location.search).get("lang") || "en";
const t = T[LANG];
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

document.getElementById("root").innerHTML = `
<div class="fig" id="fig1">
  <p class="kicker">${esc(t.f1.k)}</p>
  <h2>${esc(t.f1.h)}</h2>
  <p class="sub">${esc(t.f1.s)}</p>
  <div class="rows">
    ${t.f1.rows.map((r,i)=>`
      <div class="row">
        <div class="n">${i+1}</div>
        <div><div><h3>${esc(r.h)}</h3><span class="tag ${r.cls}">${esc(r.tag)}</span></div><p>${esc(r.p)}</p></div>
      </div>`).join("")}
  </div>
  <p class="note">${esc(t.f1.note)}</p>
</div>

<div class="fig" id="fig2">
  <p class="kicker">${esc(t.f2.k)}</p>
  <h2>${esc(t.f2.h)}</h2>
  <p class="sub">${esc(t.f2.s)}</p>
  <div class="cards">
    ${t.f2.cards.map(c=>`<div class="card"><b class="${c.c}">${esc(c.v)}</b><span>${esc(c.s)}</span></div>`).join("")}
  </div>
  <div class="barwrap">
    <div class="barlab"><span>${esc(t.f2.barA)}</span><span class="hot">${esc(t.f2.barB)}</span></div>
    <div class="track"><div class="fill" style="width:3.5%"></div></div>
  </div>
  <p class="note">${esc(t.f2.note)}</p>
</div>`;
</script>
</body>
</html>
