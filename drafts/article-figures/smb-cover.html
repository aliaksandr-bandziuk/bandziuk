<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Textless cover for «Small business SEO» (also the OG image). A search bar on the
     left branches two ways: up to a dimmed AI answer card with three source chips,
     and down to a map with three pins — one highlighted — which leads to a stack of
     local results. The top result is marked green with a phone badge and five stars:
     the one that gets the call. Palette and grain as the rest of the series. */
  :root{ --bg:#0a0a0b; --warm:#d95926; --cool:#3987e5; --green:#199e70; --gold:#c98500; }
  *{box-sizing:border-box}
  body{margin:0;background:#000}
  .cover{position:relative;width:1672px;height:941px;overflow:hidden;
    background:
      radial-gradient(900px 560px at 10% -10%, rgba(57,135,229,.18), transparent 62%),
      radial-gradient(900px 560px at 94% 110%, rgba(25,158,112,.15), transparent 60%),
      var(--bg);}
  .grain{position:absolute;inset:0;opacity:.4}
  .grain i{position:absolute;border-radius:50%;background:#fff}
  svg{position:absolute;inset:0}
  .search{position:absolute;left:120px;top:432px;width:392px;height:84px;border-radius:42px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:20px;padding:0 32px;box-shadow:0 40px 100px rgba(0,0,0,.55)}
  .search .g{width:30px;height:30px;border-radius:50%;border:4px solid rgba(207,225,251,.85);position:relative;flex:none}
  .search .g::after{content:"";position:absolute;right:-11px;bottom:-9px;width:12px;height:4px;background:rgba(207,225,251,.85);transform:rotate(45deg)}
  .search span{height:14px;border-radius:7px;background:rgba(207,225,251,.45)}

  /* dimmed AI answer card — the informational branch */
  .aio{position:absolute;left:690px;top:96px;width:430px;border-radius:20px;padding:24px 26px;border:1.5px dashed rgba(201,133,0,.55);background:rgba(201,133,0,.07);opacity:.5}
  .aio .l{height:11px;border-radius:6px;background:rgba(243,198,107,.5);margin:0 0 11px}
  .aio .chips{display:flex;gap:10px;margin-top:18px}
  .aio .chips span{flex:1;height:34px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(243,198,107,.35)}

  /* map — the local branch */
  .map{position:absolute;left:690px;top:430px;width:430px;height:300px;border-radius:26px;overflow:hidden;border:1px solid rgba(255,255,255,.14);
    background:
      linear-gradient(0deg, transparent 46%, rgba(255,255,255,.08) 46% 52%, transparent 52%),
      linear-gradient(90deg, transparent 28%, rgba(255,255,255,.07) 28% 32%, transparent 32%),
      linear-gradient(118deg, transparent 63%, rgba(255,255,255,.06) 63% 66%, transparent 66%),
      repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 10px,rgba(255,255,255,.015) 10px 20px);}
  .pin{position:absolute;width:40px;height:40px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:rgba(255,255,255,.28)}
  .pin::after{content:"";position:absolute;left:12px;top:12px;width:16px;height:16px;border-radius:50%;background:#0a0a0b}
  .pin.hot{background:var(--warm);width:58px;height:58px;box-shadow:0 20px 50px rgba(217,89,38,.45)}
  .pin.hot::after{left:18px;top:18px;width:22px;height:22px}

  /* local results */
  .card{position:absolute;left:1210px;width:330px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);padding:20px 22px;display:flex;gap:16px;align-items:flex-start}
  .card .l{height:10px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 0 11px}
  .card .shop{width:58px;height:58px;border-radius:12px;flex:none;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
  .card .shop::before{content:"";position:absolute;left:9px;top:12px;right:9px;height:9px;border-radius:3px;background:rgba(255,255,255,.5)}
  .card .shop::after{content:"";position:absolute;left:14px;bottom:10px;width:17px;height:21px;border-radius:2px 2px 0 0;background:rgba(255,255,255,.38)}
  .card .st{display:flex;gap:5px;margin-top:3px}
  .card .st b{width:15px;height:15px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .card.cited{background:rgba(25,158,112,.12);border:2px solid rgba(25,158,112,.8);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .card.dim{opacity:.4}
  .card .ph{position:absolute;right:-26px;top:-26px;width:56px;height:56px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 34px rgba(25,158,112,.4)}
</style>
</head>
<body>
<div id="root"></div>
<script>
function grain(n) {
  let s = 20261029, out = "";
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < n; i++) {
    const x = (rnd() * 1672).toFixed(0), y = (rnd() * 941).toFixed(0);
    const d = (rnd() * 1.6 + 0.6).toFixed(2), o = (rnd() * 0.3 + 0.05).toFixed(2);
    out += `<i style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;opacity:${o}"></i>`;
  }
  return out;
}
const cards = [[430, "cited"], [600, "dim"], [740, "dim"]];
const curve = (x1, y1, x2, y2, c, w, dash) => `<path d="M${x1} ${y1} C ${(x1 + x2) / 2} ${y1}, ${(x1 + x2) / 2} ${y2}, ${x2} ${y2}" stroke="${c}" stroke-width="${w}" fill="none"${dash ? ' stroke-dasharray="9 9"' : ""}/>`;
let paths = curve(512, 474, 690, 230, "rgba(201,133,0,.35)", 2.5, 1) + curve(512, 474, 690, 560, "rgba(57,135,229,.55)", 3.5);
for (const [y, c] of cards) paths += curve(1120, 560, 1210, y + 52, c === "cited" ? "rgba(25,158,112,.75)" : "rgba(255,255,255,.14)", c === "cited" ? 3 : 1.5);
const phone = '<svg width="28" height="28" viewBox="0 0 24 24" style="position:static"><path fill="#fff" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
document.getElementById("root").insertAdjacentHTML("beforeend", `
  <div class="cover" id="cover">
    <div class="grain">${grain(240)}</div>
    <svg width="1672" height="941">${paths}</svg>
    <div class="search"><div class="g"></div><span style="width:160px"></span><span style="width:96px;background:rgba(255,179,141,.8)"></span></div>
    <div class="aio"><div class="l" style="width:92%"></div><div class="l" style="width:84%"></div><div class="l" style="width:88%"></div><div class="l" style="width:52%"></div>
      <div class="chips"><span></span><span></span><span></span></div></div>
    <div class="map">
      <div class="pin" style="left:62px;top:64px"></div>
      <div class="pin hot" style="left:196px;top:116px"></div>
      <div class="pin" style="left:330px;top:192px"></div>
    </div>
    ${cards.map(([y, c]) => `<div class="card ${c}" style="top:${y}px"><div class="shop"></div><div style="flex:1"><div class="l" style="width:78%"></div><div class="l" style="width:94%"></div>
      <div class="st">${[0, 1, 2, 3, 4].map(() => "<b></b>").join("")}</div></div>${c === "cited" ? `<div class="ph">${phone}</div>` : ""}</div>`).join("")}
  </div>`);
</script>
</body>
</html>
