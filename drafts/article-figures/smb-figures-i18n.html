<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Figures for the «Small business SEO» article (29.10.2026). Same surface, type and
     slots as the GEO/AEO/LLM/ChatGPT/Attorney SEO series. Every number is repeated in
     the article text, with the same source attribution. */
  :root{
    --surface:#111114; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"DejaVu Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:var(--sans)}
  .fig{width:1200px;background:var(--surface);padding:44px 48px 40px;margin:0 0 30px}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  h2{font-size:26px;line-height:1.25;font-weight:600;color:var(--ink);margin:0 0 6px}
  .sub{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0 0 26px;max-width:86ch}
  .note{font-size:13px;color:var(--muted);margin:22px 0 0;line-height:1.5}

  /* two mini-SERPs (figure 1) */
  .serps{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .serp{border-radius:16px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.1);padding:18px 18px 16px}
  .qbar{display:flex;align-items:center;gap:10px;border-radius:22px;background:rgba(255,255,255,.07);padding:10px 16px;margin:0 0 8px;color:#fff;font-size:15px}
  .qbar i{width:15px;height:15px;border-radius:50%;border:2.5px solid #cfe1fb;position:relative;flex:none}
  .qbar i::after{content:"";position:absolute;right:-6px;bottom:-5px;width:7px;height:2.5px;background:#cfe1fb;transform:rotate(45deg)}
  .qlbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;padding-left:4px}
  .blk{border-radius:10px;padding:10px 12px;margin:0 0 9px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
  .blk .t{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 7px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .blk .t em{font-style:normal;font-size:15px;font-weight:700;letter-spacing:0}
  .blk .ln{height:8px;border-radius:4px;background:rgba(255,255,255,.16);margin:0 0 6px}
  .blk .ln.s{background:rgba(255,255,255,.09)}
  .blk.map{border-color:rgba(25,158,112,.65);background:rgba(25,158,112,.08)}
  .blk.map .t{color:#62d3a9}
  .blk.faint{opacity:.42}
  .mapbox{display:grid;grid-template-columns:110px 1fr;gap:10px}
  .mapimg{border-radius:8px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 6px,rgba(255,255,255,.02) 6px 12px);position:relative;height:88px}
  .pin{position:absolute;width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--s2)}
  .firm{display:flex;align-items:center;gap:8px;margin:0 0 7px}
  .firm .ln{flex:1;margin:0}
  .stars{font-size:11px;letter-spacing:1px;color:#f3c66b;flex:none}
  .blk.aio{border-color:rgba(201,133,0,.7);background:rgba(201,133,0,.08)}
  .blk.aio .t{color:#f3c66b}
  .src{display:flex;gap:6px;margin-top:8px}
  .src span{flex:1;height:24px;border-radius:6px;background:rgba(255,255,255,.07);border:1px solid rgba(243,198,107,.35)}
  .blk.org .t{color:#9fc3f3}
  .ctr{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:16px}
  .ctrbox{border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);padding:16px 18px}
  .ctrbox .h{font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .pair{display:flex;align-items:flex-end;gap:14px}
  .pair .col{flex:1}
  .pair .bar{border-radius:6px 6px 0 0;background:var(--s2)}
  .pair .bar.dim{background:rgba(255,255,255,.18)}
  .pair .col.was b{color:var(--ink-2)}
  .pair .col.now b{color:#ffa882}
  .pair b{display:block;font-size:22px;font-weight:700;color:#fff;margin:0 0 6px}
  .pair span{display:block;font-size:12px;color:var(--muted);line-height:1.35;margin-top:6px}
  .aiband{margin-top:16px;border-radius:14px;padding:16px 20px;border:1px dashed rgba(201,133,0,.6);background:rgba(201,133,0,.07);display:flex;gap:26px;align-items:center}
  .aiband .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#f3c66b;flex:none;width:160px;line-height:1.4}
  .aiband div.c{display:flex;align-items:baseline;gap:10px}
  .aiband div.c b{font-size:25px;color:#f3c66b;font-weight:700;flex:none}
  .aiband div.c span{font-size:13.5px;color:var(--ink-2);line-height:1.4}
  .quote{margin-top:16px;border-radius:14px;padding:16px 20px;border-left:3px solid var(--s3);background:rgba(25,158,112,.07)}
  .quote p{margin:0;font-size:15px;line-height:1.5;color:#fff}
  .quote cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:8px}

  /* steps (figure 2) */
  .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .step{border-radius:14px;padding:18px 16px 16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;position:relative}
  .step .n{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em;margin:0 0 10px}
  .step h3{font-size:16.5px;line-height:1.3;color:#fff;margin:0 0 10px;font-weight:600}
  .step p{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin:0 0 14px;flex:1}
  .step .stat{border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
  .step .stat b{display:block;font-size:27px;line-height:1.1;font-weight:700}
  .step .stat span{display:block;font-size:12px;line-height:1.4;color:var(--muted);margin-top:4px}
  .step .stat + .stat{margin-top:10px}
  .step::after{content:"";position:absolute;right:-12px;top:34px;width:10px;height:10px;border-top:2px solid rgba(255,255,255,.35);border-right:2px solid rgba(255,255,255,.35);transform:rotate(45deg)}
  .step:last-child::after{display:none}

  /* plan (figure 3) */
  .phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;position:relative}
  .ph{border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1);padding:0 0 14px;overflow:hidden}
  .ph .hd{padding:14px 16px 12px}
  .ph .wk{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .ph h3{font-size:17px;line-height:1.3;color:#fff;margin:6px 0 0;font-weight:600}
  .ph ul{list-style:none;margin:4px 0 0;padding:0 16px}
  .ph li{font-size:13.5px;line-height:1.42;color:var(--ink-2);padding:7px 0 7px 18px;position:relative;border-top:1px solid rgba(255,255,255,.06)}
  .ph li::before{content:"";position:absolute;left:0;top:13px;width:8px;height:8px;border-radius:2px;background:currentColor;opacity:.9}
  .timeline{margin-top:18px;position:relative;height:46px}
  .timeline .bar{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--s4),var(--s1) 45%,var(--s3))}
  .timeline .m{position:absolute;top:24px;font-size:12.5px;color:var(--ink-2);transform:translateX(-50%);white-space:nowrap}
  .timeline .d{position:absolute;top:7px;width:16px;height:16px;border-radius:50%;background:#111114;border:3px solid #fff;transform:translateX(-50%)}

  /* age bars + funnel (figure 4) */
  .tl2{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
  .panel .ph3{font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
  .bars{display:flex;flex-direction:column;gap:12px}
  .row{display:grid;grid-template-columns:150px 1fr 66px;gap:12px;align-items:center}
  .row .lb{font-size:13.5px;color:var(--ink-2);line-height:1.35;text-align:right}
  .row .tr{height:26px;border-radius:5px;background:rgba(255,255,255,.055);overflow:hidden}
  .row .fl{height:100%;border-radius:5px}
  .row .vl{font-size:17px;font-weight:700;color:#fff;font-family:var(--mono)}
  .funnel{display:flex;flex-direction:column;gap:0}
  .fn{border-radius:12px;padding:14px 18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035)}
  .fn b{font-size:26px;font-weight:700;line-height:1.1;display:block}
  .fn span{display:block;font-size:13px;line-height:1.42;color:var(--ink-2);margin-top:5px}
  .fnarr{height:22px;position:relative}
  .fnarr::after{content:"";position:absolute;left:34px;top:3px;width:10px;height:10px;border-right:2px solid rgba(255,255,255,.4);border-bottom:2px solid rgba(255,255,255,.4);transform:rotate(45deg)}
  .fn.w1{width:100%} .fn.w2{width:84%} .fn.w3{width:66%}
  .bigstat{margin-top:20px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);padding:18px 20px;display:flex;align-items:baseline;gap:16px}
  .bigstat b{font-size:40px;font-weight:700;color:#fff;line-height:1;flex:none}
  .bigstat span{font-size:14px;line-height:1.45;color:var(--ink-2)}
</style>
</head>

function section(lang, id, t) {
  const s = document.createElement("div");
  s.className = "fig"; s.id = `${lang}-${id}`;
  s.innerHTML = `<p class="kicker">${t.k}</p><h2>${t.h}</h2><p class="sub">${t.s}</p>`;
  document.getElementById("root").appendChild(s);
  return s;
}
const ln = (w, s) => `<div class="ln${s ? " s" : ""}" style="width:${w}%"></div>`;
const head = (txt, val) => `<p class="t">${txt}${val ? `<em>${val}</em>` : ""}</p>`;
const PINS = [[18, 26], [52, 50], [76, 20]];
const mapblk = (cls, label, val) => `<div class="blk ${cls}">${head(label, val)}<div class="mapbox"><div class="mapimg">${PINS.map(([x, y]) => `<div class="pin" style="left:${x}%;top:${y}%"></div>`).join("")}</div>
  <div>${[0, 1, 2].map(() => `<div class="firm">${ln(58)}<span class="stars">★★★★★</span></div>`).join("")}</div></div></div>`;

function aifig(lang, t) {
  const s = section(lang, "ai", t);
  const col = (d, order) => `<div class="serp"><div class="qbar"><i></i>${d.q}</div><p class="qlbl">${d.lbl}</p>${order.map((key) => {
    const [label, val] = d[key];
    if (key === "map") return mapblk(val === "93%" ? "map" : "map faint", label, val);
    if (key === "aio") return `<div class="blk aio${val === "15%" ? " faint" : ""}">${head(label, val)}${ln(95)}${ln(88)}${ln(60, 1)}<div class="src"><span></span><span></span><span></span></div></div>`;
    return `<div class="blk org">${head(label, val)}${ln(70)}${ln(85, 1)}${ln(45, 1)}</div>`;
  }).join("")}</div>`;
  s.insertAdjacentHTML("beforeend", `<div class="serps">${col(t.left, ["map", "org", "aio"])}${col(t.right, ["aio", "org", "map"])}</div>
    <div class="ctr">${t.ctr.map((c) => `<div class="ctrbox"><p class="h">${c.h}</p><div class="pair">${c.pair.map(([v, l, hh, dim]) => `<div class="col ${dim ? "was" : "now"}"><b>${v}</b><div class="bar${dim ? " dim" : ""}" style="height:${Math.round(hh * 0.62)}px"></div><span>${l}</span></div>`).join("")}</div><p class="note" style="margin-top:14px">${c.note}</p></div>`).join("")}</div>
    <div class="quote"><p>${t.quote.p}</p><cite>${t.quote.c}</cite></div>
    <p class="note">${t.note}</p>`);
}
function custfig(lang, t) {
  const s = section(lang, "cust", t);
  s.insertAdjacentHTML("beforeend", `<div class="steps">${t.steps.map((x, i) => `
    <div class="step" style="border-top:3px solid var(${x.c})"><p class="n">0${i + 1}</p><h3>${x.h}</h3><p>${x.p}</p>
      ${x.st.map(([b, d]) => `<div class="stat"><b style="color:var(${x.c})">${b}</b><span>${d}</span></div>`).join("")}
      ${x.warn ? `<div class="stat" style="border-top-style:dashed"><span style="margin-top:0">${x.warn}</span></div>` : ""}</div>`).join("")}</div>
    <div class="aiband"><div class="lbl">${t.band.l}</div>${t.band.c.map(([b, d]) => `<div class="c"><b>${b}</b><span>${d}</span></div>`).join("")}</div>
    <p class="note">${t.note}</p>`);
}
function planfig(lang, t) {
  const s = section(lang, "plan", t);
  s.insertAdjacentHTML("beforeend", `<div class="phases">${t.ph.map((p) => `
    <div class="ph" style="border-top:3px solid var(${p.c})"><div class="hd"><div class="wk" style="color:var(${p.c})">${p.w}</div><h3>${p.h}</h3></div>
      <ul style="color:var(${p.c})">${p.li.map((x) => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>
    <div class="timeline"><div class="bar"></div>${t.tl.map(([l, v]) => `<div class="d" style="left:${Math.min(Math.max(v, 0.7), 99.3)}%"></div><div class="m" style="left:${v}%;${v === 0 ? "transform:none" : v === 100 ? "transform:translateX(-100%)" : ""}">${l}</div>`).join("")}</div>
    <p class="note">${t.note}</p>`);
}
function timefig(lang, t) {
  const s = section(lang, "time", t);
  const max = Math.max(...t.bars.rows.map((r) => r[1]));
  s.insertAdjacentHTML("beforeend", `<div class="tl2">
    <div class="panel"><p class="ph3">${t.bars.h}</p><div class="bars">${t.bars.rows.map(([l, v, c]) => `
      <div class="row"><div class="lb">${l}</div><div class="tr"><div class="fl" style="width:${(v / max * 100).toFixed(1)}%;background:var(${c})"></div></div><div class="vl">${String(v).replace(".", lang === "en" ? "." : ",")}%</div></div>`).join("")}</div>
      <div class="bigstat"><b>${t.bars.big[0]}</b><span>${t.bars.big[1]}</span></div>
      <p class="note" style="margin-top:16px">${t.bars.note}</p></div>
    <div class="panel"><p class="ph3">${t.funnel.h}</p><div class="funnel">${t.funnel.f.map(([b, d, c], i) => `
      ${i ? '<div class="fnarr"></div>' : ""}<div class="fn w${i + 1}" style="border-left:3px solid var(${c})"><b style="color:var(${c})">${b}</b><span>${d}</span></div>`).join("")}</div></div></div>
    <div class="quote"><p>${t.quote.p}</p><cite>${t.quote.c}</cite></div>
    <p class="note">${t.note}</p>`);
}
for (const lang of ["en", "pl", "ru"]) { aifig(lang, T[lang].ai); custfig(lang, T[lang].cust); planfig(lang, T[lang].plan); timefig(lang, T[lang].time); }
