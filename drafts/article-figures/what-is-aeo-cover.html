<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Textless cover for «What is AEO» (no wording on the preview, which is also the
     OG image). The subject in one picture: a search box, one highlighted answer
     under it, and the list of results below; the answer is lifted from the third
     result, not the first — the finding of the live test in the article. Palette
     and geometry as the GEO covers. */
  :root{ --bg:#0a0a0b; --accent:#f5a05c; --warm:#d95926; --cool:#3987e5; --line:#26262a; --line-2:#1b1b1f; }
  *{box-sizing:border-box}
  body{margin:0;background:#000}
  .cover{position:relative;width:1672px;height:941px;overflow:hidden;
    background:
      radial-gradient(1000px 600px at 86% -12%, rgba(217,89,38,.16), transparent 62%),
      radial-gradient(900px 560px at 8% 112%, rgba(57,135,229,.18), transparent 60%),
      var(--bg);}
  .grain{position:absolute;inset:0;opacity:.4}
  .grain i{position:absolute;border-radius:50%;background:#fff}
  .col{position:absolute;left:50%;top:50%;width:900px;transform:translate(-50%,-50%)}
  .search{height:66px;border-radius:33px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;padding:0 28px;gap:18px;margin:0 0 30px}
  .search .lens{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);position:relative}
  .search .lens::after{content:"";position:absolute;width:10px;height:3px;background:rgba(255,255,255,.4);right:-9px;bottom:-4px;transform:rotate(45deg);border-radius:2px}
  .search .l{height:12px;width:46%;border-radius:6px;background:rgba(255,255,255,.3)}
  .answer{position:relative;border-radius:22px;padding:30px 34px 30px 96px;margin:0 0 34px;
    background:linear-gradient(150deg, rgba(217,89,38,.22), rgba(217,89,38,.06) 60%, rgba(255,255,255,.02));
    border:1px solid rgba(217,89,38,.55);box-shadow:0 34px 80px rgba(0,0,0,.55)}
  .quote{position:absolute;left:30px;top:24px;font:700 84px/1 Georgia,serif;color:var(--accent)}
  .al{height:13px;border-radius:7px;background:rgba(255,255,255,.34);margin:0 0 14px}
  .al.sm{height:9px;background:rgba(255,255,255,.18)}
  .row{display:flex;gap:18px;align-items:flex-start;margin:0 0 26px;padding:0 6px}
  .row .n{width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:3px;flex:none}
  .row .lines{flex:1}
  .row .t{height:12px;border-radius:6px;background:var(--line);margin:0 0 10px}
  .row .s{height:7px;border-radius:4px;background:var(--line-2)}
  .row .s + .s{margin-top:7px}
  .row.on .n{background:var(--warm)} .row.on .t{background:rgba(217,89,38,.8)}
  svg.links{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
function grain(n) {
  let s = 20261025, out = "";
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < n; i++) {
    const x = (rnd() * 1672).toFixed(0), y = (rnd() * 941).toFixed(0);
    const d = (rnd() * 1.6 + 0.6).toFixed(2), o = (rnd() * 0.3 + 0.05).toFixed(2);
    out += `<i style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;opacity:${o}"></i>`;
  }
  return out;
}
const W = [[52, 88, 64], [60, 92, 58], [48, 84, 70], [56, 90, 52]];
const rows = W.map((w, i) => `<div class="row${i === 2 ? " on" : ""}"><span class="n"></span><div class="lines"><div class="t" style="width:${w[0]}%"></div><div class="s" style="width:${w[1]}%"></div><div class="s" style="width:${w[2]}%"></div></div></div>`).join("");
document.getElementById("root").insertAdjacentHTML("beforeend", `
  <div class="cover" id="cover">
    <div class="grain">${grain(240)}</div>
    <svg class="links" width="1672" height="941"></svg>
    <div class="col">
      <div class="search"><span class="lens"></span><span class="l"></span></div>
      <div class="answer"><span class="quote">“</span>
        <div class="al" style="width:92%"></div><div class="al" style="width:78%"></div>
        <div class="al sm" style="width:96%"></div><div class="al sm" style="width:70%"></div>
      </div>
      ${rows}
    </div>
  </div>`);
// a dashed curve from the third result up to the answer, along the left margin
requestAnimationFrame(() => {
  const svg = document.querySelector("svg.links"), base = document.getElementById("cover").getBoundingClientRect();
  const r = document.querySelector(".row.on .n").getBoundingClientRect(), a = document.querySelector(".answer").getBoundingClientRect();
  const x1 = r.left - base.left - 18, y1 = r.top + r.height / 2 - base.top;
  const x2 = a.left - base.left - 6, y2 = a.top + a.height / 2 - base.top;
  const bend = Math.min(x1, x2) - 120;
  const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
  p.setAttribute("d", `M${x1},${y1} C${bend},${y1} ${bend},${y2} ${x2},${y2}`);
  p.setAttribute("fill", "none"); p.setAttribute("stroke", "rgba(217,89,38,.7)"); p.setAttribute("stroke-width", "2.5"); p.setAttribute("stroke-dasharray", "7 7");
  svg.appendChild(p);
  [[x1, y1], [x2, y2]].forEach(([cx, cy]) => {
    const d = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    d.setAttribute("cx", cx); d.setAttribute("cy", cy); d.setAttribute("r", "5"); d.setAttribute("fill", "#d95926");
    svg.appendChild(d);
  });
});
</script>
</body>
</html>
