<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Textless cover for «What is GEO» (owner's rule: no wording on the preview,
     which is also the OG image). The subject in one picture: a question in a
     chat bubble, one generated answer, and the web below it as a field of
     pages; three of them are drawn up into the answer as its cited sources.
     Palette and geometry as the «GEO vs SEO» and legalizacja covers. */
  :root{ --bg:#0a0a0b; --accent:#f5a05c; --cool:#3987e5; --line:#26262a; --line-2:#1b1b1f; }
  *{box-sizing:border-box}
  body{margin:0;background:#000}
  .cover{position:relative;width:1672px;height:941px;overflow:hidden;
    background:
      radial-gradient(900px 560px at 84% -10%, rgba(245,160,92,.14), transparent 62%),
      radial-gradient(1000px 620px at 10% 112%, rgba(57,135,229,.20), transparent 60%),
      var(--bg);}
  .grain{position:absolute;inset:0;opacity:.4}
  .grain i{position:absolute;border-radius:50%;background:#fff}
  .ask{position:absolute;left:250px;top:140px;width:420px;padding:26px 30px;border-radius:26px 26px 8px 26px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
  .ask .l{height:12px;border-radius:6px;background:rgba(255,255,255,.32);margin:0 0 12px}
  .ask .l:last-child{margin:0}
  .answer{position:absolute;left:520px;top:250px;width:660px;border-radius:24px;padding:34px 38px 32px;
    background:linear-gradient(150deg, rgba(57,135,229,.22), rgba(57,135,229,.05) 60%, rgba(255,255,255,.02));
    border:1px solid rgba(57,135,229,.45);box-shadow:0 40px 90px rgba(0,0,0,.55)}
  .spark{width:46px;height:46px;margin:0 0 24px;position:relative}
  .spark::before,.spark::after{content:"";position:absolute;left:50%;top:50%;background:var(--accent);border-radius:3px}
  .spark::before{width:8px;height:46px;transform:translate(-50%,-50%)}
  .spark::after{width:46px;height:8px;transform:translate(-50%,-50%)}
  .spark i{position:absolute;inset:11px;border-radius:50%;background:var(--accent);transform:rotate(45deg);opacity:.9}
  .al{height:12px;border-radius:6px;background:rgba(255,255,255,.30);margin:0 0 14px}
  .al.sm{height:9px;background:rgba(255,255,255,.17)}
  .chips{display:flex;gap:14px;margin-top:28px}
  .chip{height:32px;border-radius:16px;background:rgba(57,135,229,.35);border:1px solid rgba(57,135,229,.75)}
  .web{position:absolute;left:150px;right:150px;top:680px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
  .pg{height:96px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);padding:14px 14px}
  .pg .t{height:9px;border-radius:5px;background:var(--line);margin:0 0 9px}
  .pg .s{height:6px;border-radius:3px;background:var(--line-2);margin:0 0 6px}
  .pg.on{border-color:rgba(57,135,229,.7);background:rgba(57,135,229,.12)}
  .pg.on .t{background:rgba(57,135,229,.8)}
  svg.links{position:absolute;inset:0;pointer-events:none}
</style>
</head>
<body>
<div id="root"></div>
<script>
function grain(n) {
  let s = 20261024, out = "";
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < n; i++) {
    const x = (rnd() * 1672).toFixed(0), y = (rnd() * 941).toFixed(0);
    const d = (rnd() * 1.6 + 0.6).toFixed(2), o = (rnd() * 0.3 + 0.05).toFixed(2);
    out += `<i style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;opacity:${o}"></i>`;
  }
  return out;
}
const ON = [2, 6, 9];
const pages = Array.from({ length: 12 }, (_, i) => `<div class="pg${ON.includes(i) ? " on" : ""}"><div class="t" style="width:${60 + ((i * 37) % 35)}%"></div><div class="s" style="width:${80 + ((i * 13) % 18)}%"></div><div class="s" style="width:${55 + ((i * 29) % 35)}%"></div><div class="s" style="width:${70 + ((i * 17) % 25)}%"></div></div>`).join("");
document.getElementById("root").insertAdjacentHTML("beforeend", `
  <div class="cover" id="cover">
    <div class="grain">${grain(240)}</div>
    <svg class="links" width="1672" height="941"></svg>
    <div class="ask"><div class="l" style="width:88%"></div><div class="l" style="width:62%"></div></div>
    <div class="answer">
      <div class="spark"><i></i></div>
      <div class="al" style="width:94%"></div><div class="al" style="width:86%"></div>
      <div class="al sm" style="width:97%"></div><div class="al sm" style="width:90%"></div><div class="al sm" style="width:74%"></div>
      <div class="chips"><div class="chip" style="width:112px"></div><div class="chip" style="width:92px"></div><div class="chip" style="width:104px"></div></div>
    </div>
    <div class="web">${pages}</div>
  </div>`);
// curves from the three cited pages up into the three source chips
requestAnimationFrame(() => {
  const svg = document.querySelector("svg.links"), base = document.getElementById("cover").getBoundingClientRect();
  const chips = [...document.querySelectorAll(".chip")], on = [...document.querySelectorAll(".pg.on")];
  on.forEach((p, k) => {
    const a = p.getBoundingClientRect(), b = chips[k].getBoundingClientRect();
    const x1 = a.left + a.width / 2 - base.left, y1 = a.top - base.top - 6;
    const x2 = b.left + b.width / 2 - base.left, y2 = b.bottom - base.top + 6;
    const my = (y1 + y2) / 2;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    path.setAttribute("fill", "none"); path.setAttribute("stroke", "rgba(57,135,229,.6)"); path.setAttribute("stroke-width", "2.5"); path.setAttribute("stroke-dasharray", "7 7");
    svg.appendChild(path);
    [[x1, y1], [x2, y2]].forEach(([cx, cy]) => {
      const d = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      d.setAttribute("cx", cx); d.setAttribute("cy", cy); d.setAttribute("r", "5"); d.setAttribute("fill", "#3987e5");
      svg.appendChild(d);
    });
  });
});
</script>
</body>
</html>
